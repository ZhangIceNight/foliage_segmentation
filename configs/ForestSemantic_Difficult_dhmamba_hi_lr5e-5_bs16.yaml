defaults:
  - base_dhmamba_hi
  - _self_
data:
  batch_size: 16
  num_workers: 4
  num_points: 4096
  data_dir: "./data/ForestSemantic_Difficult/tiles_filtered_fps"
  augmentations_list: ['rotate', 'scale', 'shift']
  fold_idx: 0
  dataset_type: ForestSemantic_Difficult
  split_json_path: "./data/ForestSemantic_Difficult/splits.json"
  use_normalization: true


model:
  num_classes: 2
  avg_volume_dist: 0.015171
  avg_chamfer_dist: 0.002446
  # dist: "chamfer"  # "volume" or "chamfer" or "interpolate"
  # dist: "volume"  # "volume" or "chamfer" or "interpolate"
  # dist: "interpolate" # "volume" or "chamfer" or "interpolate"
  num_group: [512,256,128,64]
  group_size: [8,16,32,64]
  # num_group: [1024,512,256,128]
  # group_size: [4,8,16,32]
  trans_dim: 384
  alpha: 2.0  # chamfer距离阈值倍数
  HGNeighbors: 8


optimizer:
  learning_rate: 0.00005
  weight_decay: 0.00005
  max_epochs: 100
  eta_min: 0.000001
  warmup_epochs: 5

trainer:
  max_epochs: 100
  accelerator: "gpu"
  devices: [1]

comet:
  # name: "ForestSemantic_Difficult_dhmamba_ms_chamfer_lr2e-4_bs16"
  name: "ForestSemantic_Difficult_dhmamba_hi_lr5e-5_bs16"
  # name: "ForestSemantic_Difficult_dhmamba_ms_interpolate_lr2e-4_bs16"
